<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachers - THE SMART MODERN PUBLIC SCHOOL QAMBER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <main class="content-area">
        <div class="card">
          <div class="card-header">
            <span><i class="fas fa-chalkboard-teacher me-2"></i>All Teachers</span>
            <button class="btn btn-sm btn-primary no-print" onclick="openTeacherModal()"><i class="fas fa-plus me-1"></i>Add Teacher</button>
          </div>
          <div class="card-body">
            <div class="filter-bar no-print">
              <div class="form-group">
                <label class="form-label">Search</label>
                <input type="text" class="form-control" id="searchInput" placeholder="Name, ID, Email...">
              </div>
              <div class="form-group">
                <label class="form-label">Status</label>
                <select class="form-select" id="filterStatus">
                  <option value="">All</option>
                  <option value="active" selected>Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th></th>
                    <th>Employee ID</th>
                    <th>Name</th>
                    <th>Designation</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th class="no-print">Actions</th>
                  </tr>
                </thead>
                <tbody id="teachersBody"></tbody>
              </table>
            </div>
            <div class="text-muted small mt-2" id="tableInfo"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="teacherModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="teacherModalTitle">Add Teacher</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="teacherForm" novalidate>
            <input type="hidden" id="teacherId">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Full Name *</label><input type="text" class="form-control" id="tName" required></div>
              <div class="col-md-6"><label class="form-label">Father's Name</label><input type="text" class="form-control" id="tFather"></div>
              <div class="col-md-4"><label class="form-label">Gender *</label><select class="form-select" id="tGender" required><option value="">Select</option><option>Male</option><option>Female</option></select></div>
              <div class="col-md-4"><label class="form-label">Date of Birth</label><input type="date" class="form-control" id="tDob"></div>
              <div class="col-md-4"><label class="form-label">Employee ID *</label><input type="text" class="form-control" id="tEmpId" required></div>
              <div class="col-md-6"><label class="form-label">Phone *</label><input type="tel" class="form-control" id="tPhone" required></div>
              <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" id="tEmail"></div>
              <div class="col-12"><label class="form-label">Address</label><input type="text" class="form-control" id="tAddress"></div>
              <div class="col-md-6"><label class="form-label">Qualification</label><input type="text" class="form-control" id="tQualification"></div>
              <div class="col-md-3"><label class="form-label">Experience (years)</label><input type="number" class="form-control" id="tExperience" min="0"></div>
              <div class="col-md-3"><label class="form-label">Joining Date</label><input type="date" class="form-control" id="tJoining"></div>
              <div class="col-md-6"><label class="form-label">Designation</label><input type="text" class="form-control" id="tDesignation"></div>
              <div class="col-md-3"><label class="form-label">Salary</label><input type="number" class="form-control" id="tSalary" min="0"></div>
              <div class="col-md-3"><label class="form-label">Status</label><select class="form-select" id="tStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveTeacher()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/teachers.js"></script>
</body>
</html>
