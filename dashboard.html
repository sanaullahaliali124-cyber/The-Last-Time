<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - THE SMART MODERN PUBLIC SCHOOL QAMBER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <main class="content-area">
        <!-- Stats Cards -->
        <div class="row g-3 mb-4" id="statsCards"></div>

        <!-- Charts Row -->
        <div class="row g-3 mb-4">
          <div class="col-lg-4 col-md-6">
            <div class="card h-100">
              <div class="card-header">Student Statistics</div>
              <div class="card-body">
                <div class="chart-container">
                  <canvas id="genderChart"></canvas>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-4 col-md-6">
            <div class="card h-100">
              <div class="card-header">Today's Attendance</div>
              <div class="card-body">
                <div class="chart-container">
                  <canvas id="attendanceChart"></canvas>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-4 col-md-6">
            <div class="card h-100">
              <div class="card-header">Fee Collection</div>
              <div class="card-body">
                <div class="chart-container">
                  <canvas id="feeChart"></canvas>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Notices & Upcoming -->
        <div class="row g-3">
          <div class="col-lg-7">
            <div class="card">
              <div class="card-header">
                <span>Latest Notices</span>
                <a href="notices.html" class="btn btn-sm btn-outline-primary">View All</a>
              </div>
              <div class="card-body p-0">
                <div id="noticesList"></div>
              </div>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="card mb-3">
              <div class="card-header">Upcoming Exams</div>
              <div class="card-body p-0">
                <div id="examsList"></div>
              </div>
            </div>
            <div class="card">
              <div class="card-header">Quick Actions</div>
              <div class="card-body">
                <div class="d-flex flex-wrap gap-2">
                  <a href="students.html?action=add" class="btn btn-sm btn-primary"><i class="fas fa-user-plus me-1"></i>Add Student</a>
                  <a href="attendance.html" class="btn btn-sm btn-success"><i class="fas fa-calendar-check me-1"></i>Mark Attendance</a>
                  <a href="fees.html" class="btn btn-sm btn-info text-white"><i class="fas fa-money-bill me-1"></i>Collect Fee</a>
                  <a href="notices.html" class="btn btn-sm btn-warning"><i class="fas fa-bullhorn me-1"></i>Post Notice</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
