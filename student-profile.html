<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile - THE SMART MODERN PUBLIC SCHOOL QAMBER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <main class="content-area">
        <div class="d-flex justify-content-between mb-3 no-print">
          <a href="students.html" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i>Back to Students</a>
          <div>
            <button class="btn btn-sm btn-outline-primary" onclick="window.print()"><i class="fas fa-print me-1"></i>Print</button>
            <button class="btn btn-sm btn-primary" id="btnEditProfile"><i class="fas fa-edit me-1"></i>Edit</button>
          </div>
        </div>
        <div class="card" id="profileCard">
          <div class="profile-header" id="profileHeader">
            <div class="profile-photo"><i class="fas fa-user"></i></div>
            <h3 id="pName">-</h3>
            <p class="mb-0 opacity-75" id="pClass">-</p>
          </div>
          <div class="card-body">
            <div class="row g-4">
              <div class="col-md-6">
                <h6 class="text-muted text-uppercase small mb-3">Basic Information</h6>
                <table class="table table-borderless table-sm">
                  <tr><td class="text-muted" width="40%">Admission No</td><td id="pAdmission" class="fw-medium">-</td></tr>
                  <tr><td class="text-muted">Roll Number</td><td id="pRoll">-</td></tr>
                  <tr><td class="text-muted">Date of Birth</td><td id="pDob">-</td></tr>
                  <tr><td class="text-muted">Gender</td><td id="pGender">-</td></tr>
                  <tr><td class="text-muted">Blood Group</td><td id="pBlood">-</td></tr>
                  <tr><td class="text-muted">Status</td><td id="pStatus">-</td></tr>
                </table>
              </div>
              <div class="col-md-6">
                <h6 class="text-muted text-uppercase small mb-3">Parent & Contact</h6>
                <table class="table table-borderless table-sm">
                  <tr><td class="text-muted" width="40%">Father's Name</td><td id="pFather">-</td></tr>
                  <tr><td class="text-muted">Mother's Name</td><td id="pMother">-</td></tr>
                  <tr><td class="text-muted">Phone</td><td id="pPhone">-</td></tr>
                  <tr><td class="text-muted">Email</td><td id="pEmail">-</td></tr>
                  <tr><td class="text-muted">Address</td><td id="pAddress">-</td></tr>
                  <tr><td class="text-muted">Emergency</td><td id="pEmergency">-</td></tr>
                </table>
              </div>
              <div class="col-md-6">
                <h6 class="text-muted text-uppercase small mb-3">Academic</h6>
                <table class="table table-borderless table-sm">
                  <tr><td class="text-muted" width="40%">Admission Date</td><td id="pAdmDate">-</td></tr>
                  <tr><td class="text-muted">Previous School</td><td id="pPrevSchool">-</td></tr>
                </table>
              </div>
              <div class="col-md-6">
                <h6 class="text-muted text-uppercase small mb-3">Fee Status</h6>
                <div id="feeStatusBox">Loading...</div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!requirePermission('students')) return;
      initLayout('Student Profile', 'students');
      const id = new URLSearchParams(window.location.search).get('id');
      if (!id) { window.location.href = 'students.html'; return; }
      const s = getById('students', id);
      if (!s) { showToast('Student not found', 'error'); return; }

      document.getElementById('pName').textContent = s.fullName;
      document.getElementById('pClass').textContent = `${getClassName(s.classId)} - Section ${s.section}`;
      document.getElementById('pAdmission').textContent = s.admissionNo;
      document.getElementById('pRoll').textContent = s.rollNo;
      document.getElementById('pDob').textContent = formatDate(s.dob);
      document.getElementById('pGender').textContent = s.gender;
      document.getElementById('pBlood').textContent = s.bloodGroup || '-';
      document.getElementById('pStatus').innerHTML = `<span class="badge badge-status badge-${s.status}">${s.status}</span>`;
      document.getElementById('pFather').textContent = s.fatherName || '-';
      document.getElementById('pMother').textContent = s.motherName || '-';
      document.getElementById('pPhone').textContent = s.phone || '-';
      document.getElementById('pEmail').textContent = s.email || '-';
      document.getElementById('pAddress').textContent = [s.address, s.city].filter(Boolean).join(', ') || '-';
      document.getElementById('pEmergency').textContent = s.emergencyContact || '-';
      document.getElementById('pAdmDate').textContent = formatDate(s.admissionDate);
      document.getElementById('pPrevSchool').textContent = s.previousSchool || '-';

      // Fee status
      const payments = getData('feePayments').filter(f => f.studentId === id);
      if (payments.length) {
        const totalPaid = payments.reduce((a, p) => a + (p.paidAmount || 0), 0);
        const totalPending = payments.reduce((a, p) => a + (p.remaining || 0), 0);
        document.getElementById('feeStatusBox').innerHTML = `
          <div class="d-flex gap-3">
            <div><div class="small text-muted">Paid</div><div class="fw-bold text-success">${formatCurrency(totalPaid)}</div></div>
            <div><div class="small text-muted">Pending</div><div class="fw-bold text-warning">${formatCurrency(totalPending)}</div></div>
          </div>`;
      } else {
        document.getElementById('feeStatusBox').innerHTML = '<span class="text-muted">No fee records</span>';
      }

      document.getElementById('btnEditProfile').onclick = () => {
        window.location.href = `students.html?edit=${id}`;
      };
    });
  </script>
</body>
</html>
