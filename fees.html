<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fees - THE SMART MODERN PUBLIC SCHOOL QAMBER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <main class="content-area">
        <ul class="nav nav-tabs mb-3" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#collectTab">Collect Fee</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#historyTab">Payment History</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#pendingTab">Pending Fees</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#structureTab">Fee Structure</button></li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane fade show active" id="collectTab">
            <div class="card">
              <div class="card-header">Collect Fee</div>
              <div class="card-body">
                <form id="feeForm" class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Student *</label>
                    <select class="form-select" id="feeStudent" required></select>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Month *</label>
                    <input type="month" class="form-control" id="feeMonth" required>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Fee Type</label>
                    <select class="form-select" id="feeType">
                      <option>Tuition</option><option>Admission</option><option>Exam</option><option>Computer</option><option>Transport</option><option>Other</option>
                    </select>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Amount *</label>
                    <input type="number" class="form-control" id="feeAmount" required min="0">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Discount</label>
                    <input type="number" class="form-control" id="feeDiscount" value="0" min="0">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Paid Amount *</label>
                    <input type="number" class="form-control" id="feePaid" required min="0">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Payment Method</label>
                    <select class="form-select" id="feeMethod">
                      <option>Cash</option><option>Bank Transfer</option><option>Online</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <button type="button" class="btn btn-primary" onclick="collectFee()"><i class="fas fa-money-bill me-1"></i>Collect & Generate Receipt</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <div class="tab-pane fade" id="historyTab">
            <div class="card">
              <div class="card-header">Payment History</div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table">
                    <thead><tr><th>Invoice</th><th>Student</th><th>Month</th><th>Amount</th><th>Paid</th><th>Method</th><th>Date</th><th>Status</th></tr></thead>
                    <tbody id="historyBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
          <div class="tab-pane fade" id="pendingTab">
            <div class="card">
              <div class="card-header">Pending Fees</div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table">
                    <thead><tr><th>Student</th><th>Class</th><th>Month</th><th>Total</th><th>Paid</th><th>Pending</th><th>Status</th></tr></thead>
                    <tbody id="pendingBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
          <div class="tab-pane fade" id="structureTab">
            <div class="card">
              <div class="card-header">Fee Structure by Class</div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table">
                    <thead><tr><th>Class</th><th>Admission</th><th>Tuition</th><th>Exam</th><th>Computer</th><th>Transport</th><th>Other</th></tr></thead>
                    <tbody id="structureBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/fees.js"></script>
</body>
</html>
