<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - THE SMART MODERN PUBLIC SCHOOL QAMBER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <header class="topbar" id="topbar"></header>
      <main class="content-area">
        <div class="card mb-3">
          <div class="card-header">Mark Student Attendance</div>
          <div class="card-body">
            <div class="filter-bar">
              <div class="form-group">
                <label class="form-label">Date</label>
                <input type="date" class="form-control" id="attDate">
              </div>
              <div class="form-group">
                <label class="form-label">Class</label>
                <select class="form-select" id="attClass"><option value="">Select Class</option></select>
              </div>
              <div class="form-group">
                <label class="form-label">Section</label>
                <select class="form-select" id="attSection"><option value="">Select</option></select>
              </div>
              <div class="form-group">
                <label class="form-label">&nbsp;</label>
                <button class="btn btn-primary d-block" onclick="loadAttendanceStudents()"><i class="fas fa-search me-1"></i>Load Students</button>
              </div>
            </div>
            <div class="d-flex gap-2 mb-3 no-print" id="bulkActions" style="display:none!important">
              <button class="btn btn-sm btn-success" onclick="markAll('present')"><i class="fas fa-check me-1"></i>Mark All Present</button>
              <button class="btn btn-sm btn-danger" onclick="markAll('absent')"><i class="fas fa-times me-1"></i>Mark All Absent</button>
              <button class="btn btn-sm btn-primary" onclick="saveAttendance()"><i class="fas fa-save me-1"></i>Save Attendance</button>
            </div>
            <div class="table-responsive">
              <table class="table" id="attTable">
                <thead>
                  <tr>
                    <th>Roll</th>
                    <th>Student Name</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="attBody">
                  <tr><td colspan="3"><div class="empty-state py-4"><i class="fas fa-calendar-check"></i><h5>Select class & section to mark attendance</h5></div></td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/attendance.js"></script>
</body>
</html>
