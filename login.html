<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - THE SMART MODERN PUBLIC SCHOOL QAMBER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <h1>THE SMART MODERN PUBLIC SCHOOL</h1>
      <p>Qamber • School Management System</p>
    </div>
    <div class="login-body">
      <div class="alert alert-warning py-2 small mb-3" role="alert">
        <i class="fas fa-info-circle me-1"></i>
        <strong>DEMO MODE</strong> — LocalStorage authentication only. Do not use real credentials.
      </div>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Username / Email</label>
          <input type="text" class="form-control" id="username" placeholder="Enter username or email" required autocomplete="username">
          <div class="invalid-feedback">Please enter username or email.</div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="password" placeholder="Enter password" required autocomplete="current-password">
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback">Please enter password.</div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>
          <a href="#" class="small text-primary" onclick="alert('Demo: Contact admin to reset password.'); return false;">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-login">
          <i class="fas fa-sign-in-alt me-2"></i>Login
        </button>
      </form>

      <div class="demo-accounts">
        <h6><i class="fas fa-key me-1"></i> Demo Accounts (click to fill)</h6>
        <div id="demoAccountsList"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (isAuthenticated()) {
      window.location.href = 'dashboard.html';
    }

    // Remember me
    const remembered = localStorage.getItem('sms_remember');
    if (remembered) {
      document.getElementById('username').value = remembered;
      document.getElementById('rememberMe').checked = true;
    }

    // Demo accounts
    const demoList = document.getElementById('demoAccountsList');
    getDemoAccounts().forEach(acc => {
      const badge = document.createElement('span');
      badge.className = 'badge bg-secondary me-1 mb-1';
      badge.style.cursor = 'pointer';
      badge.textContent = `${acc.role}: ${acc.username}`;
      badge.title = `Password: ${acc.password}`;
      badge.onclick = () => {
        document.getElementById('username').value = acc.username;
        document.getElementById('password').value = acc.password;
      };
      demoList.appendChild(badge);
    });

    // Toggle password
    document.getElementById('togglePassword').addEventListener('click', function() {
      const input = document.getElementById('password');
      const icon = this.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });

    // Login form
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = this;
      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;

      const result = login(username, password, remember);
      if (result.success) {
        window.location.href = 'dashboard.html';
      } else {
        alert(result.message || 'Login failed');
      }
    });
  </script>
</body>
</html>
